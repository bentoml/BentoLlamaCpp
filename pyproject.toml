[project]
name = "bento-llama-cpp"
dependencies = [
  "bentoml==1.4.19",
  "fastapi>=0.115.12",
  "huggingface-hub>=0.30.2",
  "llama-cpp-python",
  "openai>=1.74.0",
]
version = "0.0.0"
requires-python = ">=3.11"

[tool.bentoml.build]
service = "service.py:LlamaCpp"
include = ["*.py", "*.yaml", "*.md", "*.toml"]

[tool.ruff]
extend-include = ["*.ipynb"]
preview = true
line-length = 119
indent-width = 2

[tool.ruff.format]
preview = true
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "RUF012",
  "ANN",    # Mypy is better at this
  "E722",
]
select = [
  "F",
  "G",     # flake8-logging-format
  "PERF",  # perflint
  "RUF",   # Ruff-specific rules
  "W6",
  "E71",
  "E72",
  "E112",
  "E113",
  "E203",
  "E272",
  "E502",
  "E702",
  "E703",
  "E731",
  "W191",
  "W291",
  "W293",
  "UP039", # unnecessary-class-parentheses
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = ["ipython>=9.1.0", "ruff>=0.11.5"]
